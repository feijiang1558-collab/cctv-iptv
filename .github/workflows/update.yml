name: 每日更新央视卫视直播源
on:
  schedule:
    - cron: '22 22 * * *'
    - cron: '22 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 从官方源池提取频道
        run: python extract.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cctv.m3u
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "更新央视+卫视直播源 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
