name: 每日更新央视直播源

on:
  schedule:
    # UTC 时间。每天 16:00 UTC = 北京时间次日 00:00；每天 22:00 UTC = 北京时间次日 06:00
    # 北京时间 06:00 与 18:00 各更新一次，避开单一时点失效
    - cron: '22 22 * * *'   # 北京时间 06:22
    - cron: '22 10 * * *'   # 北京时间 18:22
  workflow_dispatch:        # 允许在 GitHub 页面手动点击触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行采集与实测脚本
        run: python update.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cctv.m3u
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新央视6频道直播源 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
